name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads FreeRTOS)
        run: cmake -S firmware -B firmware/build

      - name: Build
        run: cmake --build firmware/build -j

      - name: Unit tests (PID, motor model, CAN protocol)
        run: ctest --test-dir firmware/build --output-on-failure

      - name: Run the 7 s test scenario
        working-directory: firmware/build
        run: timeout 20 ./motor_firmware

  can-and-python:
    name: DBC check and Python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CAN tools
        run: pip install cantools python-can

      - name: DBC file loads and encodes the expected bytes
        run: python can/can_test.py

      - name: Python files compile
        run: python -m py_compile sim/src/car_control/car_control/*.py sim/src/car_description/scripts/*.py

      - name: Unit tests of the driving logic (pytest)
        working-directory: sim/src/car_control
        run: |
          pip install pytest
          python -m pytest -v test/test_safety_logic.py test/test_lane_logic.py

  ros-integration:
    name: ROS 2 integration test (launch_testing)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: Install launch_testing
        run: apt-get update && apt-get install -y ros-jazzy-launch-testing-ros

      - name: Build car_control
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd sim && colcon build --packages-select car_control

      - name: Run safety_node integration test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source sim/install/setup.bash
          launch_test sim/src/car_control/test/test_safety_node_integration.py
